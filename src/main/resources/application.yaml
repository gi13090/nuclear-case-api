spring:
  application:
    name: nuclear-case-api
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: jdbc:h2:mem:nuclearcase;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
